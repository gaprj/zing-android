# Example snippets for an Nginx deployment.
# Put the limit_req_zone line in the http {} block, not in the server {} block.
limit_req_zone $binary_remote_addr zone=zing_pro_redeem:10m rate=5r/m;

# Inside the HTTPS server {} for your real hostname:
location = /api/v1/redeem {
    limit_req zone=zing_pro_redeem burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/entitlement {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
